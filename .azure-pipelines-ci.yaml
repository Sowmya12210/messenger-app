trigger:
- feature-branch


pool:
  vmImage: 'ubuntu-latest'

variables:
- group: azure-group  # contains PROJECT_ID, REGION, REPO, etc.
- name: IMAGE_TAG
  value: $(Build.BuildId)
- name: REGISTRY_URL
  value: "$(REGION)-docker.pkg.dev"
- name: FRONTEND_IMAGE
  value: "$(REGISTRY_URL)/$(PROJECT_ID)/$(REPO)/frontend:$(IMAGE_TAG)"
- name: BACKEND_IMAGE
  value: "$(REGISTRY_URL)/$(PROJECT_ID)/$(REPO)/backend:$(IMAGE_TAG)"

stages:
- stage: BuildAndPush
  displayName: "Build & Push Docker Images"
  jobs:
  - job: BuildPushJob
    displayName: "Build and Push to Artifact Registry"
    steps:
    - task: DownloadSecureFile@1
      name: gcpKey
      displayName: "Download GCP Key"
      inputs:
        secureFile: 'gcp-key.json'

    - task: Bash@3
      displayName: "Install gcloud CLI"
      inputs:
        targetType: 'inline'
        script: |
          if ! command -v gcloud &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y apt-transport-https ca-certificates gnupg curl
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] http://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
            curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key add -
            sudo apt-get update -y && sudo apt-get install -y google-cloud-cli
          fi

    - task: Bash@3
      displayName: "Authenticate to GCP and Configure Docker"
      inputs:
        targetType: 'inline'
        script: |
          gcloud auth activate-service-account --key-file=$(gcpKey.secureFilePath)
          gcloud auth configure-docker $(REGION)-docker.pkg.dev -q

    - task: Bash@3
      displayName: "Build & Push Frontend and Backend"
      inputs:
        targetType: 'inline'
        script: |
          echo "Building and pushing the FRONTEND..."
          FRONTEND_BASE=$(REGISTRY_URL)/$(PROJECT_ID)/$(REPO)/frontend
          docker build -t $FRONTEND_BASE:$(Build.BuildId) -t $FRONTEND_BASE:latest ./frontend
          docker push $FRONTEND_BASE --all-tags

          echo "Building and pushing BACKEND..."
          BACKEND_BASE=$(REGISTRY_URL)/$(PROJECT_ID)/$(REPO)/backend
          docker build -t $BACKEND_BASE:$(Build.BuildId) -t $BACKEND_BASE:latest ./backend
          docker push $BACKEND_BASE --all-tags

          # docker build -t $(FRONTEND_IMAGE) ./frontend
          # docker tag $(FRONTEND_IMAGE) $(REGISTRY_URL)/$(PROJECT_ID)/$(REPO)/frontend:latest
          # docker push $(FRONTEND_IMAGE)
          # docker push $(REGISTRY_URL)/$(PROJECT_ID)/$(REPO)/frontend:latest

          # echo "Building and pushing BACKEND..."
          # docker build -t $(BACKEND_IMAGE) ./backend
          # docker tag $(BACKEND_IMAGE) $(REGISTRY_URL)/$(PROJECT_ID)/$(REPO)/backend:latest
          # docker push $(BACKEND_IMAGE)
          # docker push $(REGISTRY_URL)/$(PROJECT_ID)/$(REPO)/backend:latest

    - task: Bash@3
      displayName: "Trigger CD Pipeline"
      env:
        AZURE_DEVOPS_EXT_PAT: $(AZURE_DEVOPS_PAT)
      inputs:
        targetType: 'inline'
        script: |
          echo "Triggering CD Pipeline..."
          az devops configure --defaults organization=https://dev.azure.com/SailsTraining/ project="Devops Intern2"
          az devops login --organization https://dev.azure.com/SailsTraining/ <<< "$(AZURE_DEVOPS_PAT)"
          
          az pipelines run --name "azure-pipelines-cd" \
            --parameters frontendTag=$(Build.BuildId) backendTag=$(Build.BuildId)
