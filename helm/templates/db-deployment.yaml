apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: mysql
          image: {{ .Values.db.image }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "{{ .Values.db.rootPassword }}"
            - name: MYSQL_DATABASE
              value: "{{ .Values.db.database }}"
          ports:
            - containerPort: {{ .Values.db.port }}
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: {{ .Values.db.storage }}
