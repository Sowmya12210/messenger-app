<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Message App</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fredoka One', cursive;
      background: linear-gradient(135deg, #e6ccff, #ffcce6, #cce0ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .wrapper {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 30px;
    }

    .container {
      background: #fff;
      width: 100%;
      max-width: 500px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      background-color: #ff99cc;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background-color: #ff80b3;
      transform: scale(1.05);
    }

    ul {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 10px;
    }

    li {
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 12px;
      position: relative;
      word-wrap: break-word;
    }

    li:nth-child(odd) {
      background-color: #ffe6f2;
      align-self: flex-start;
    }

    li:nth-child(even) {
      background-color: #e6f2ff;
      align-self: flex-end;
    }

    .timestamp {
      font-size: 10px;
      color: #555;
      position: absolute;
      bottom: 5px;
      right: 10px;
    }

    .side-image {
      width: 150px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    @media(max-width: 800px) {
      .wrapper {
        flex-direction: column;
      }
      .side-image {
        width: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Left side image -->
    <!--<img src="https://images.stockcake.com/public/9/8/f/98fe52ad-7b0e-4dec-9600-bd4d73becfcb_large/joyful-anime-graduate-stockcake.jpg"
         alt="Joyful Graduate" class="side-image"> -->
    <div class="container">
      <h1>Student Message App</h1>

      <form id="messageForm">
        <input type="text" id="messageInput" placeholder="Enter your message" required>
        <button type="submit">Send</button>
      </form>

      <ul id="messagesList"></ul>
    </div>

    <!-- Right side image -->
    <img src="https://images.stockcake.com/public/8/6/8/86898681-2480-4d00-a241-e0801a77e8c9_medium/cheerful-anime-student-stockcake.jpg"
         alt="Cute Student" class="side-image">
  </div>

  <script>
    //const BACKEND_URL = '{{ .Values.frontend.env.BACKEND_URL | default "http://backend:5000" }}';
    const form = document.getElementById("messageForm");
    const input = document.getElementById("messageInput");
    const list = document.getElementById("messagesList");

    function formatTime(ts) {
      const date = new Date(ts);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function loadMessages() {
      list.innerHTML = "";
      try {
        const res = await fetch("http://136.118.169.251/messages");
      

        const messages = await res.json();

        if (!Array.isArray(messages)) return;

        messages.forEach(msg => {
          const li = document.createElement("li");
          li.textContent = msg.text;

          const span = document.createElement("span");
          span.className = "timestamp";
          span.textContent = msg.created_at ? formatTime(msg.created_at) : "";
          li.appendChild(span);

          list.appendChild(li);
        });

        list.scrollTop = list.scrollHeight;
      } catch (err) {
        console.error("Error fetching messages:", err);
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      try {
        await fetch("http://136.118.169.251/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        input.value = "";
        loadMessages();

        // Open a new cute "success" page
        const successWindow = window.open("", "_blank");
        successWindow.document.write(`
          <html>
            <head>
              <title>Message Sent!</title>
              <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
              <style>
                body {
                  font-family: 'Fredoka One', cursive;
                  display: flex;
                  flex-direction: column;
                  justify-content: center;
                  align-items: center;
                  height: 100vh;
                  background: linear-gradient(135deg, #e6ccff, #ffcce6, #cce0ff);
                  text-align: center;
                }
                h1 {
                  font-size: 2rem;
                  color: #ff66b3;
                  margin-bottom: 20px;
                }
                img {
                  width: 250px;
                  border-radius: 20px;
                  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                }
              </style>
            </head>
            <body>
              <h1>You successfully sent a message!</h1>
              <img src="https://images.stockcake.com/public/8/6/8/86898681-2480-4d00-a241-e0801a77e8c9_medium/cheerful-anime-student-stockcake.jpg" alt="Cheering Student">
            </body>
          </html>
        `);

      } catch (err) {
        console.error("Error sending message:", err);
      }
    });

    loadMessages();
    setInterval(loadMessages, 5000);
  </script>
</body>
</html>
